name: Terraform

# Pull requests: fmt, validate, tflint, then plan posted as a PR comment.
# Push to main (a merged PR): apply.
# AWS access is OIDC only (no stored keys). Repo variables needed:
#   AWS_REGION, TF_STATE_BUCKET, TF_CI_ROLE_ARN
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: 1.15.9
  TF_IN_AUTOMATION: "true"

jobs:
  checks:
    name: fmt, validate, tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # main.tf reads the state bucket name from backend.hcl, so it must exist
      # for every command. It is git-ignored; generate it from repo variables.
      - name: Write backend.hcl
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          region = "${{ vars.AWS_REGION }}"
          EOF

      - run: terraform fmt -check -recursive

      - run: terraform init -backend=false -input=false

      - run: terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: tflint --recursive

  plan:
    name: plan
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend.hcl
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          region = "${{ vars.AWS_REGION }}"
          EOF

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init -backend-config=backend.hcl -input=false

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Render plan
        run: terraform show -no-color tfplan > plan.txt

      - name: Comment plan on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            let plan = fs.readFileSync('plan.txt', 'utf8');
            // PR comments are limited to 65536 characters.
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n... (truncated, see the workflow log)';
            }
            const body = `${marker}\n### Terraform plan\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    name: apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never run two applies at once; state locking is a second line of defence.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend.hcl
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          region = "${{ vars.AWS_REGION }}"
          EOF

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init -backend-config=backend.hcl -input=false

      # Output is kept out of the log (it can include resource details); it is
      # printed only if the apply fails so errors stay debuggable.
      - name: Apply
        run: |
          if ! terraform apply -input=false -auto-approve -no-color > apply.log 2>&1; then
            cat apply.log
            exit 1
          fi
          echo "Apply succeeded."
